  --bg:#f2f4f5; --surface:#ffffff; --surface2:#e8eaed; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
  --text:#111214; --muted:#60646c; --blue:#335fff; --blue-d:#2347d6; --green:#00b06f; --gold:#ffcc4d; --gold-ink:#c98a00;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;background:#e3e6ea;color:var(--text);font-family:'Montserrat',system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}

.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.phone.full{position:fixed!important;top:0;left:0;transform-origin:0 0;border-radius:0!important;box-shadow:none!important}
.phone.full::before{display:none!important}
.phone.full .status{display:none}
.phone.full .nav{margin-top:calc(4px + env(safe-area-inset-top))}
.phone.wide .nav,.phone.wide .main{width:100%;max-width:600px;margin-left:auto;margin-right:auto}
.phone.wide .divider{width:calc(100% - 28px);max-width:572px;margin-left:auto;margin-right:auto}
.phone.wide .balance{width:calc(100% - 24px);max-width:576px;margin-left:auto;margin-right:auto}
.phone.wide .sheet{max-width:440px}
.rotate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f2f4f5;color:#111214;font-family:'Montserrat',system-ui,sans-serif;text-align:center}
.rotate.on{display:flex}
.rotate svg{width:64px;height:64px;animation:turn 1.8s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
.rotate b{font-size:18px;font-weight:800}
@media (min-width:500px){
  body{background:#dfe2e6}
  .phone{border-radius:54px;box-shadow:0 0 0 11px #1b1b1d,0 0 0 13px #2c2c2f,0 40px 120px rgba(0,0,0,.8)}
  .phone::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:95}
}
.phone::after{content:"";position:absolute;left:0;right:0;top:0;height:420px;pointer-events:none;z-index:0;background:radial-gradient(70% 60% at 50% 0%,rgba(51,95,255,.09),transparent 70%)}

/* ---------- top ---------- */
.status{position:relative;z-index:5;height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 4px;font-weight:700;font-size:15px}
.status .icons{display:flex;gap:6px;align-items:center}
.nav{position:relative;z-index:5;flex:none;height:56px;display:flex;align-items:center;padding:0 14px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:transparent;border:none}
.icon-btn svg{width:22px;height:22px}
.pillT{box-shadow:0 1px 3px rgba(0,0,0,.06);position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:900;font-size:15px;letter-spacing:.06em}
.pillT i{width:6px;height:6px;border-radius:50%;background:var(--text);opacity:.85}
.divider{position:relative;z-index:5;flex:none;height:1px;background:var(--line);margin:0 14px}

/* balance on top */
.balance{box-shadow:0 2px 10px rgba(0,0,0,.05);position:relative;z-index:5;flex:none;margin:14px 12px 0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.balance small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.balance .n{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.balance .n img{width:30px;height:auto}
.balance.bump .n{animation:bump .25s ease-out}
@keyframes bump{50%{transform:scale(1.07)}}
.balance .left{font-size:13px;font-weight:700;color:var(--muted);text-align:right}
.balance .left b{display:block;font-size:22px;color:var(--text);font-weight:900}

/* ---------- main ---------- */
.main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding:0 12px}
.head{flex:none;text-align:center;margin-top:16px}
.head h1{font-size:23px;font-weight:900}
.head p{margin-top:5px;font-size:14px;font-weight:600;color:var(--muted)}
.steps{flex:none;display:flex;gap:6px;margin-top:12px}
.steps span{width:40px;height:4px;border-radius:2px;background:var(--surface2);transition:background .3s}
.steps span.on{background:var(--gold);box-shadow:0 0 8px rgba(255,204,77,.6)}

.tablewrap{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.table{position:relative;width:366px;height:344px;flex:none;transform-origin:50% 50%}

.card{position:absolute;left:0;top:0;width:116px;height:166px;perspective:900px;cursor:pointer;transition:transform .55s cubic-bezier(.2,.9,.3,1),opacity .4s;will-change:transform}
.card.fast{transition:transform .32s cubic-bezier(.4,0,.2,1)}
.card .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.card.flip .in{transform:rotateY(180deg)}
.card.press .in{transform:scale(.94)}
.face{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:var(--gc) center/contain no-repeat;border-radius:10px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.22))}
.card.ready .back{animation:idle 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes idle{0%,100%{filter:drop-shadow(0 8px 14px rgba(0,0,0,.22))}50%{filter:drop-shadow(0 8px 14px rgba(0,0,0,.22)) drop-shadow(0 0 10px rgba(51,95,255,.55))}}
.front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(100% 70% at 50% 25%,#ffffff,#eef0f3);border:1px solid var(--line2);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.front img{width:48px;height:auto;margin-top:8px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.front b{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:4px}
.front span{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.front code{margin-top:7px;padding:4px 5px;border-radius:6px;background:#f2f4f5;border:1px dashed rgba(0,0,0,.25);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:700;font-size:10.5px;letter-spacing:.03em;color:#2b2d31;white-space:nowrap}
.front .tag{position:absolute;top:7px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:900;letter-spacing:.14em;padding:3px 8px;border-radius:6px;background:rgba(255,204,77,.22);color:var(--gold-ink)}
.card.rare .front{border-color:rgba(230,170,20,.75);box-shadow:0 8px 20px rgba(0,0,0,.12),0 0 20px rgba(255,204,77,.45)}
.card.rare .front b{color:var(--gold-ink)}
.card.flip .front::after{content:"";position:absolute;top:-30%;bottom:-30%;width:45%;left:-70%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:shine .9s .35s ease-out forwards}
@keyframes shine{to{left:140%}}
.card.miss{opacity:.45;cursor:default}
.card.miss .front{filter:grayscale(.85)}
.card.miss .front code{visibility:hidden}
.card.picked .front{outline:2px solid var(--blue);outline-offset:-2px}
.card.rare.picked .front{outline-color:var(--gold)}
.pop{position:absolute;z-index:20;pointer-events:none;font-weight:900;font-size:22px;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:4px;text-shadow:0 0 6px #fff,0 0 12px #fff;animation:pop 1.2s cubic-bezier(.2,.8,.3,1) forwards}
.pop img{width:20px;height:auto}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}

.foot{flex:none;width:100%;padding:0 0 calc(22px + env(safe-area-inset-bottom))}
.btn{position:relative;display:block;width:100%;margin-top:12px;border:none;border-radius:12px;padding:15px;font-family:inherit;font-weight:800;font-size:16px;color:#fff;cursor:pointer;background:var(--blue);transition:transform .1s,background .2s}
.btn:active{transform:scale(.98);background:var(--blue-d)}
.btn[disabled]{background:var(--surface2);color:#8a8e96;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text);margin-top:10px;font-size:15px}
.btn.claim{background:var(--green);font-size:17px;animation:claim 1.1s ease-in-out infinite}
@keyframes claim{50%{transform:scale(1.03);box-shadow:0 0 0 4px rgba(0,176,111,.25)}}

.phone.short .balance{margin-top:10px;padding:10px 14px}
.phone.short .balance .n{font-size:24px}
.phone.short .head{margin-top:10px}
.phone.short .head h1{font-size:20px}
.phone.short .head p{display:none}

/* ---------- redeem window ---------- */
.modal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:40;background:rgba(15,18,24,.45);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{width:100%;border-radius:16px;background:var(--surface);border:1px solid var(--line2);padding:22px 18px 18px;text-align:center;transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.2,1.3,.4,1);box-shadow:0 24px 60px rgba(0,0,0,.22)}
.modal.open .sheet{transform:none}
.sheet .gcbig{width:62px;height:90px;margin:0 auto 10px;background:var(--gc) center/contain no-repeat;transform:rotate(-6deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.sheet h3{font-size:21px;font-weight:900}
.sheet p{margin-top:6px;font-size:14px;line-height:1.45;font-weight:600;color:var(--muted)}
.fld{display:block;margin-top:16px;text-align:left}
.fld > span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.fld .row{display:flex;gap:8px}
.fld input{flex:1;min-width:0;font-family:inherit;font-weight:600;font-size:16px;color:var(--text);background:#f4f5f7;border:1px solid var(--line2);border-radius:10px;padding:12px 13px;outline:none}
.fld input::placeholder{color:#9a9ea6}
.fld input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(51,95,255,.25)}
.fld.err input{border-color:#ff4d5e;box-shadow:0 0 0 3px rgba(255,77,94,.22);animation:nope .3s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.paste{flex:none;display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);color:var(--text);font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.paste svg{width:16px;height:16px}
.paste:active{transform:scale(.96);background:#dcdfe3}
.profile{display:none;align-items:center;gap:12px;margin-top:14px;padding:10px 12px 10px 10px;text-align:left;border-radius:12px;background:#f4f5f7;border:1px solid var(--line);animation:pfIn .3s cubic-bezier(.2,1.4,.4,1)}
.profile.on{display:flex}
@keyframes pfIn{from{opacity:0;transform:scale(.92)}}
.profile .av{position:relative;flex:none;width:54px;height:54px;border-radius:50%;background:#d5d7da}
.profile .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.profile .av i{position:absolute;right:-1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:var(--green);border:3px solid #f4f5f7}
.profile .who{min-width:0;flex:1}
.profile .who b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .who span{display:block;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .ok{flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.prog{height:6px;border-radius:3px;background:#e6e8eb;overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .45s}
.step{margin-top:10px;min-height:18px;font-size:13px;font-weight:700}

/* ---------- congratulations screen ---------- */
.win{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
  background:radial-gradient(70% 50% at 50% 42%,rgba(255,204,77,.3),transparent 70%),var(--bg)}
.win.open{display:flex;animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0}}
.win .rays{position:absolute;left:50%;top:42%;width:620px;height:620px;margin:-310px 0 0 -310px;pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,70,.4) 0 7deg,transparent 7deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 58%);mask:radial-gradient(circle,#000 0,transparent 58%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.win .ico{position:relative;width:110px;height:auto;filter:drop-shadow(0 6px 16px rgba(200,140,0,.45));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.win h2{position:relative;margin-top:18px;font-size:32px;font-weight:900}
.win .sub{position:relative;margin-top:6px;font-size:15px;font-weight:700;color:var(--muted)}
.win .amt{position:relative;margin-top:10px;display:flex;align-items:center;gap:10px;font-size:52px;font-weight:900;color:var(--gold-ink);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(255,255,255,.8)}
.win .amt img{width:46px;height:auto}
.win .to{position:relative;margin-top:14px;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.win .to img{width:30px;height:30px;border-radius:50%;background:#d5d7da;object-fit:cover}
.win .btn{position:relative;max-width:280px;margin-top:28px}
#confetti{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:65;pointer-events:none}

.reveal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:var(--bg)}
.reveal.open{display:flex;animation:rshake .45s steps(3) 2}
@keyframes rshake{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-2px)}}
.reveal .emoji{font-size:92px;line-height:1}
.reveal h1{margin-top:14px;font-size:40px;font-weight:900;line-height:1.05}
.reveal p{margin-top:12px;font-size:16px;line-height:1.45;font-weight:600;color:var(--muted)}
.reveal .stat{margin-top:20px;padding:12px 26px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.reveal .stat b{display:block;font-size:32px;font-weight:900;color:var(--text)}
.reveal .btn{max-width:280px}
.reveal .fan{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));font-size:11px;font-weight:600;color:var(--muted);opacity:.8}
</style>
</head>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const RBX = $('rbxSrc').src;
  document.querySelectorAll('img[data-rbx]').forEach(i => i.src = RBX);
  $('winAva').src = $('avaSrc').src;

  // fit the 390px-wide design to any screen
  const phoneEl = $('phone'); let S = 1;
  // phone & tablet: fill the whole screen; computer: show a phone frame
  const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
  function fit(){
    const vv = window.visualViewport, W = vv ? vv.width : innerWidth, H = vv ? vv.height : innerHeight;
    const touch = W < 500 || mq('(pointer: coarse)') || mq('(hover: none)');
    const sideways = touch && W > H && H < 500;               // phone turned sideways
    $('rotate').classList.toggle('on', sideways);
    let w, h;
    if (touch){
      S = W < 500 ? W / 390 : Math.max(1, Math.min(W / 390, H / 800));   // tablets: bigger interface
      w = W / S; h = H / S;
    } else {
      S = Math.min(1, (H - 40) / 844, (W - 40) / 390); w = 390; h = 844;
    }
    phoneEl.style.width = w + 'px';
    phoneEl.style.height = h + 'px';
    phoneEl.style.transform = 'scale(' + S + ')';
    phoneEl.style.webkitTransform = 'scale(' + S + ')';
    phoneEl.classList.toggle('full', touch);
    phoneEl.classList.toggle('wide', touch && w > 520);
    phoneEl.classList.toggle('short', h < 760);
    requestAnimationFrame(() => {
      const wrap = $('tablewrap'), kMax = phoneEl.classList.contains('wide') ? 1.7 : 1.12;
      const k = Math.min(kMax, (wrap.clientHeight - 6) / 344, wrap.clientWidth / 366);
      $('table').style.transform = 'scale(' + Math.max(.6, k) + ')';
    });
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('pointerdown', () => {
    const d = document.documentElement;
    if (!phoneEl.classList.contains('full') || document.fullscreenElement || document.webkitFullscreenElement) return;
    try {
      const r = d.requestFullscreen ? d.requestFullscreen({ navigationUI: 'hide' }) : (d.webkitRequestFullscreen ? d.webkitRequestFullscreen() : null);
      if (r && r.catch) r.catch(() => {});
    } catch(_){}
  }, { once: true });
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 120));
  document.addEventListener('webkitfullscreenchange', () => setTimeout(fit, 120));
  addEventListener('orientationchange', () => setTimeout(fit, 150));
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);

  const fmt = n => n.toLocaleString('en-US');
  const clock = () => { const d = new Date(); $('clock').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2,'0'); };
  clock(); setInterval(clock, 10000);

  // random made-up code, e.g. 7KQ2-M9XD-4TPA (not a real gift card code)
  const ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const fakeCode = () => Array.from({length: 3}, () => Array.from({length: 4}, () => ABC[Math.floor(Math.random() * ABC.length)]).join('')).join('-');

  // ---------- cards ----------
  const table = $('table');
  const W = 116, H = 166, GX = 9, GY = 12, PICKS = 3;
  const slots = [];
  for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) slots.push([c * (W + GX), r * (H + GY)]);
  const CENTER = [(366 - W) / 2, (344 - H) / 2];
  const SMALL = [50, 500, 1000], JACK = 10000;
  let cards = [], total = 0, picks = 0, ready = false, timers = [], jackPick = 0, jackGiven = false;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const place = (el, x, y, rot = 0) => { el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + rot + 'deg)'; };

  function makeValues(){
    const v = Array.from({length: 6}, () => SMALL[Math.floor(Math.random() * SMALL.length)]);   // 50 / 500 / 1,000
    v[Math.floor(Math.random() * 6)] = JACK;                                                     // one 10,000 card
    return v;
  }
  const frontHTML = (v, code) => (v >= JACK ? '<div class="tag">JACKPOT</div>' : '') +
    '<img alt="" src="' + RBX + '"><b>' + fmt(v) + '</b><span>Robux</span><code>' + code + '</code>';
  function setVal(c, v){
    c.v = v;
    c.el.classList.toggle('rare', v >= JACK);
    c.el.querySelector('.front').innerHTML = frontHTML(v, c.code);
  }

  function deal(){
    timers.forEach(clearTimeout); timers = [];
    table.innerHTML = ''; cards = []; total = 0; picks = 0; ready = false;
    jackPick = Math.floor(Math.random() * PICKS); jackGiven = false;   // which of the 3 taps opens the 10,000
    $('balN').textContent = '0'; $('leftN').textContent = PICKS;
    $('headT').textContent = 'Shuffling cards…';
    const btn = $('redeemBtn'); btn.disabled = true; btn.textContent = 'Pick 3 cards to redeem'; btn.classList.remove('claim');
    makeValues().forEach((v, i) => {
      const el = document.createElement('div');
      const code = fakeCode();
      el.className = 'card fast' + (v >= JACK ? ' rare' : '');
      el.style.setProperty('--d', (i * .35) + 's');
      el.innerHTML = '<div class="in"><div class="face back"></div><div class="face front">' + frontHTML(v, code) + '</div></div>';
      place(el, CENTER[0], CENTER[1] - i * 2, (i - 2.5) * 2);
      el.style.zIndex = i;
      table.appendChild(el);
      const c = { el, v, code, slot: i, open: false };
      cards.push(c);
      el.addEventListener('pointerdown', () => { if (ready && !c.open) el.classList.add('press'); });
      ['pointerup','pointerleave','pointercancel'].forEach(t => el.addEventListener(t, () => el.classList.remove('press')));
      el.addEventListener('click', () => pick(c));
    });
    // shuffle twice, then deal into the grid
    const riffle = t0 => {
      cards.forEach((c, i) => later(() => place(c.el, CENTER[0] + (i % 2 ? 70 : -70), CENTER[1] + (i % 3 - 1) * 6, i % 2 ? 9 : -9), t0));
      cards.forEach((c, i) => later(() => { c.el.style.zIndex = (i * 7) % 6; place(c.el, CENTER[0], CENTER[1] - i * 2, (Math.random() - .5) * 8); }, t0 + 340 + i * 40));
    };
    riffle(250); riffle(1000);
    [...cards].sort(() => Math.random() - .5).forEach((c, k) => {
      c.slot = k;
      later(() => { c.el.classList.remove('fast'); c.el.style.zIndex = 10 + k; place(c.el, slots[k][0], slots[k][1], 0); if (navigator.vibrate) try { navigator.vibrate(6); } catch(_){} }, 1800 + k * 140);
    });
    later(() => { cards.forEach(c => c.el.classList.add('ready')); ready = true; $('headT').textContent = 'Pick 3 cards'; }, 1800 + 6 * 140 + 450);
  }

  function countTo(target, el){
    const from = +el.textContent.replace(/\D/g, '') || 0, t0 = performance.now(), dur = 700;
    (function step(t){
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(Math.round(from + (target - from) * e));
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  function pick(c){
    if (!ready || c.open || picks >= PICKS) return;
    // the 10,000 card always ends up among your 3 picks
    if (c.v === JACK) jackGiven = true;
    else if (!jackGiven && (picks === jackPick || picks === PICKS - 1)){
      const j = cards.find(o => !o.open && o.v === JACK);
      if (j){ setVal(j, c.v); setVal(c, JACK); jackGiven = true; }
    }
    c.open = true; picks++;
    c.el.classList.remove('ready'); c.el.classList.add('flip', 'picked');
    total += c.v;
    $('leftN').textContent = PICKS - picks;
    setTimeout(() => {
      countTo(total, $('balN'));
      const b = $('balance'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
      const p = document.createElement('div'); p.className = 'pop';
      p.innerHTML = '+' + fmt(c.v) + '<img alt="" src="' + RBX + '">';
      p.style.left = (slots[c.slot][0] + W / 2) + 'px'; p.style.top = (slots[c.slot][1] + 6) + 'px';
      table.appendChild(p); setTimeout(() => p.remove(), 1200);
    }, 300);
    if (navigator.vibrate) try { navigator.vibrate(c.v >= JACK ? [30,40,30] : 12); } catch(_){}
    if (picks < PICKS){ $('headT').textContent = c.v >= JACK ? 'Jackpot!' : 'Pick ' + (PICKS - picks) + ' more'; return; }
    // 3 picked: lock the table and show the cards you didn't pick
    ready = false;
    $('headT').textContent = 'Your 3 gift cards';
    cards.filter(o => !o.open).forEach((o, k) => setTimeout(() => { o.el.classList.remove('ready'); o.el.classList.add('flip', 'miss'); }, 900 + k * 220));
    setTimeout(() => { const btn = $('redeemBtn'); btn.disabled = false; btn.textContent = 'Redeem ' + fmt(total) + ' Robux'; btn.classList.add('claim'); }, 1700);
  }

  // ---------- redeem: username (+ Paste) → profile → congratulations → prank ----------
  const open = id => $(id).classList.add('open');
  const close = m => m.classList.remove('open');
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) close(m); });
  });
  let nick = '';
  const nickIn = $('exNick');
  nickIn.addEventListener('input', () => $('nickFld').classList.remove('err'));
  function flagErr(id){ const f = $(id); f.classList.remove('err'); void f.offsetWidth; f.classList.add('err'); }

  // "Paste" just fills in a random made-up username
  const A1 = ['Shadow','Pixel','Turbo','Frost','Blaze','Epic','Ninja','Cosmic','Lucky','Silent','Crazy','Golden','Dark','Speedy','Mega'];
  const A2 = ['Wolf','Builder','Gamer','King','Hunter','Fox','Knight','Dragon','Noob','Rider','Master','Tiger','Bloxer','Storm','Ghost'];
  $('pasteBtn').onclick = () => {
    const any = a => a[Math.floor(Math.random() * a.length)];
    const n = any(A1) + any(A2) + (Math.random() < .5 ? '_' : '') + Math.floor(10 + Math.random() * 9990);
    nickIn.value = n.slice(0, 20);
    $('nickFld').classList.remove('err');
  };

  $('redeemBtn').onclick = () => {
    if ($('redeemBtn').disabled) return;
    $('exProgWrap').style.display = 'none'; $('exStep').textContent = '';
    $('exGo').style.display = ''; $('exCancel').style.display = '';
    $('nickFld').style.display = ''; $('nickFld').classList.remove('err'); $('exProfile').classList.remove('on');
    $('exTitle').textContent = 'Redeem ' + fmt(total) + ' Robux';
    $('exText').textContent = 'Enter your username to redeem your 3 gift cards.';
    open('exModal');
  };
  $('exGo').onclick = () => {
    nick = nickIn.value.trim();
    if (!nick){ flagErr('nickFld'); return; }
    if (document.activeElement) document.activeElement.blur();
    $('nickFld').style.display = 'none';
    $('exGo').style.display = 'none'; $('exCancel').style.display = 'none';
    $('exTitle').textContent = 'Sending…';
    $('exText').textContent = '@' + nick + ' · ' + fmt(total) + ' Robux';
    $('exProgWrap').style.display = ''; const bar = $('exProg'); bar.style.width = '0';
    const steps = ['Connecting to server…', 'Finding @' + nick + '…', 'Checking gift card codes…', 'Adding ' + fmt(total) + ' Robux…', 'Almost done…'];
    let i = 0;
    const tick = () => {
      if (i < steps.length){
        $('exStep').textContent = steps[i];
        bar.style.width = ((i + 1) / steps.length * 100) + '%';
        if (i === 2){ $('pfName').textContent = nick; $('pfUser').textContent = '@' + nick; $('exProfile').classList.add('on'); }
        i++; setTimeout(tick, i === 2 ? 700 : 220 + Math.random() * 280);
      } else {
        setTimeout(showWin, 250);
      }
    };
    tick();
  };

  function showWin(){
    close($('exModal'));
    $('winN').textContent = '0'; $('winNick').textContent = '@' + nick;
    $('win').classList.add('open');
    confetti();
    if (navigator.vibrate) try { navigator.vibrate([40,30,40]); } catch(_){}
    setTimeout(() => countTo(total, $('winN')), 250);
  }
  function showPrank(){
    $('win').classList.remove('open');
    $('revealText').textContent = 'Sorry @' + nick + ', these Robux aren’t real.';
    $('reveal').classList.add('open');
    if (navigator.vibrate) try { navigator.vibrate([60,40,60]); } catch(_){}
  }
  $('winBtn').onclick = showPrank;
  $('again').onclick = () => { $('reveal').classList.remove('open'); deal(); };

  // ---------- confetti ----------
  const cf = $('confetti'), cx = cf.getContext('2d'); let bits = [], running = false;
  function confetti(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2), Wd = cf.offsetWidth, Hd = cf.offsetHeight;
    cf.width = Wd * dpr; cf.height = Hd * dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const cols = ['#ffcc4d','#335fff','#00b06f','#a855f7','#ff5a66'];
    for (let i = 0; i < 150; i++){
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 280 + Math.random() * 420;
      bits.push({ x: Wd / 2, y: Hd * .42, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - .5) * 14, c: cols[i % cols.length], life: 2.6 + Math.random() });
    }
    if (running) return;
    running = true; let last = performance.now();
    (function f(t){
      const dt = Math.min(.05, (t - last) / 1000); last = t;
      cx.clearRect(0,0,Wd,Hd);
      bits = bits.filter(b => (b.life -= dt) > 0);
      for (const b of bits){
        b.vy += 520 * dt; b.vx *= .99; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.globalAlpha = Math.min(1, b.life); cx.fillStyle = b.c; cx.fillRect(-b.w/2, -b.h/2, b.w, b.h * Math.abs(Math.cos(b.r * 1.3))); cx.restore();
      }
      if (bits.length) requestAnimationFrame(f); else { running = false; cx.clearRect(0,0,Wd,Hd); }
    })(last);
  }

  deal();
})();
</script>
